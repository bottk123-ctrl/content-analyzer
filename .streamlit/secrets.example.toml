# Пример конфигурации. Скопируйте в secrets.toml и заполните своими значениями.
# Файл secrets.toml добавлен в .gitignore — реальные секреты НЕ коммитьте.

[google_oauth]
# Из Google Cloud Console -> APIs & Services -> Credentials -> OAuth client ID
client_id = "ВАШ_CLIENT_ID.apps.googleusercontent.com"
client_secret = "ВАШ_CLIENT_SECRET"
# Должен ТОЧНО совпадать с Authorized redirect URI в Google Cloud.
# Для локального запуска:
redirect_uri = "http://localhost:8501/"
# Для Streamlit Cloud используйте публичный URL приложения, например:
# redirect_uri = "https://<app-name>.streamlit.app/"
scopes = [
  "openid",
  "email",
  "profile",
  "https://www.googleapis.com/auth/youtube.readonly",
]

[security]
# Ключ шифрования OAuth-токенов перед записью в БД.
# Сгенерировать: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
token_encryption_key = "ВАШ_КЛЮЧ_FERNET"

[database]
# Локально можно оставить SQLite.
url = "sqlite:///content_analyzer.db"
# На Streamlit Cloud файловая система непостоянна — используйте внешний Postgres:
# url = "postgresql://user:password@host:5432/dbname"
